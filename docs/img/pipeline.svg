<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 190" font-family="system-ui,-apple-system,Segoe UI,sans-serif" role="img" aria-label="ScanMesh pipeline: target flows through nmap, OWASP ZAP, sqlmap and tshark into one correlated report">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .box{fill:none;stroke-width:2;rx:12}
    .lab{font-size:14px;font-weight:700}
    .sub{fill:#94a3b8;font-size:10px;font-weight:600;letter-spacing:.4px}
    .flow{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 6;fill:none;opacity:.55}
  </style>

  <!-- connectors -->
  <path class="flow" d="M120 70 H180"/>
  <path class="flow" d="M290 70 H340"/>
  <path class="flow" d="M450 70 H500"/>
  <path class="flow" d="M610 70 H700"/>
  <path class="flow" d="M565 120 Q650 120 700 88"/>

  <!-- nodes -->
  <g>
    <rect class="box" x="20"  y="46" width="100" height="48" rx="12" stroke="#2dd4bf"/>
    <text class="lab" x="70"  y="68" fill="#2dd4bf" text-anchor="middle">Target</text>
    <text class="sub" x="70"  y="83" text-anchor="middle">URL / host</text>

    <rect class="box" x="180" y="46" width="110" height="48" rx="12" stroke="#60a5fa"/>
    <text class="lab" x="235" y="68" fill="#60a5fa" text-anchor="middle">nmap</text>
    <text class="sub" x="235" y="83" text-anchor="middle">open ports</text>

    <rect class="box" x="340" y="46" width="110" height="48" rx="12" stroke="#fb923c"/>
    <text class="lab" x="395" y="68" fill="#fb923c" text-anchor="middle">ZAP</text>
    <text class="sub" x="395" y="83" text-anchor="middle">web scan</text>

    <rect class="box" x="500" y="46" width="110" height="48" rx="12" stroke="#f87171"/>
    <text class="lab" x="555" y="68" fill="#f87171" text-anchor="middle">sqlmap</text>
    <text class="sub" x="555" y="83" text-anchor="middle">confirm SQLi</text>

    <rect class="box" x="475" y="100" width="90" height="40" rx="12" stroke="#34d399"/>
    <text class="lab" x="520" y="118" fill="#34d399" text-anchor="middle" font-size="12">tshark</text>
    <text class="sub" x="520" y="132" text-anchor="middle" font-size="9">evidence</text>

    <rect class="box" x="700" y="42" width="150" height="56" rx="14" stroke="#2dd4bf" stroke-width="2.5"/>
    <text class="lab" x="775" y="66" fill="#2dd4bf" text-anchor="middle">Correlated</text>
    <text class="lab" x="775" y="84" fill="#2dd4bf" text-anchor="middle">report</text>
  </g>

  <!-- traveling scan pulse -->
  <circle r="5" fill="#2dd4bf" filter="url(#glow)">
    <animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1"
      path="M70 70 H235 235 H395 395 H555 555 H775"/>
    <animate attributeName="opacity" dur="3s" repeatCount="indefinite"
      values="0;1;1;1;1;0" keyTimes="0;0.05;0.4;0.7;0.95;1"/>
  </circle>

  <!-- caption -->
  <text x="470" y="176" text-anchor="middle" fill="#64748b" font-size="12" font-weight="600">
    discover &#8594; scan &#8594; confirm &#8594; capture &#8594; correlate &#8212; 100% rule-based, no LLM
  </text>
</svg>
